name: tests
on:
  push:
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/ai-gateway/index.ts supabase/functions/uptime-check/index.ts supabase/functions/app-export/index.ts supabase/functions/contract-file/index.ts supabase/functions/contract-center/index.ts supabase/functions/ops-ai/index.ts supabase/functions/verify-publish/index.ts
      - run: deno test -A --no-check tests/models.test.ts tests/gateway.test.ts tests/contract.test.ts tests/codecheck.test.ts tests/contract-center.test.ts tests/ops.test.ts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: |
          set -e
          for t in pricing payments engine wizard wizard2 sitechat contracts gensite variety edit admin-chat items cart banners contract-gate storage-cap apps pathsite auth repro-hang freeze admin-browse bottom-nav sweep; do echo "== $t"; node tests/$t.js; done
