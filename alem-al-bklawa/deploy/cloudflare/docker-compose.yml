# Store + Cloudflare Tunnel. No ports are opened on the server: Cloudflare reaches the store through an outbound tunnel.
# Run from the alem-al-bklawa/ folder:  docker compose -f deploy/cloudflare/docker-compose.yml --env-file .env up -d --build
services:
  store:
    build: ../..
    restart: unless-stopped
    environment:                    # explicit list: the tunnel token is NOT passed to the store
      NODE_ENV: production
      DATA_DIR: /data
      TRUST_PROXY: "1"
      SITE_URL: ${SITE_URL:?set SITE_URL in .env (https://your-domain)}
      APP_SECRET: ${APP_SECRET:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - abk-data:/data            # database, uploaded images, encryption key — back this up (see scripts/backup.js)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (Zero Trust → Networks → Tunnels)}
    depends_on: [store]
volumes:
  abk-data:
