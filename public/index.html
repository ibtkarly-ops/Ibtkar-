const ROLES=['customer','super_admin','admin','technical_manager','developer','ai_supervisor','support_manager','support_agent','billing_manager','content_manager','marketing_manager'];
const STAFF_ADMIN=['super_admin','admin'];
let me=null,prof=null;

function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
const fail=e=>toast(((e&&e.message)&&(T[L][e.message]||e.message))||t('err'),1);

async function loadMe(){
  try{
    const {data}=await withTimeout(sb.auth.getSession(),10000,'session');me=data.session?.user||null;prof=null;
    if(me){const r=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=r.data}
  }catch(e){/* جلسة بطيئة: نكمل كزائر ولا نعلّق الصفحة */}
}
const isAdm=()=>prof&&STAFF_ADMIN.includes(prof.role);
const isSuper=()=>prof&&prof.role==='super_admin';

function chrome(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $('#langbtn').textContent=L==='ar'?'EN':'ع';
  const h=location.hash||'#/';
  $('#links').innerHTML=[['#/',t('home')],['#/pricing',t('pricing')],['#/apps',t('apps')]].map(([a,n])=>`<a href="${a}" class="${h===a?'on':''}">${n}</a>`).join('');

function mountFrame(fr,html,scripts){const f=document.createElement('iframe');f.setAttribute('sandbox',scripts?'allow-scripts':'');f.setAttribute('tabindex','-1');f.setAttribute('aria-hidden','true');f.setAttribute('loading','lazy');f.srcdoc=scripts?html:html.replace(/<script\b(?![^>]*type="application\/(?:ld\+)?json")[\s\S]*?<\/script>/gi,'');const fit=()=>fr.style.setProperty('--s',((fr.clientWidth||320)/1280).toFixed(4));fit();fr.appendChild(f);if(window.ResizeObserver)new ResizeObserver(fit).observe(fr)}
function fxAfter(v){
  const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(FXIO)FXIO.disconnect();
  const lazy=[...v.querySelectorAll('[data-demo],[data-thumb]')];
  // المعاينات (أمثلة حيّة + صور مواقعي) ثابتة بلا جافاسكربت: الحركات البصرية (CSS) تبقى، لكن لا مؤقّتات
  // ولا مستمعات ولا مراقبين تعمل داخلها إلى الأبد — هذا ما كان يسبّب تجمّد الصفحة عند التمرير.
  let pending=0;
  const load=fr=>{if(fr._m)return;fr._m=1;const i=pending++;setTimeout(()=>{if(fr.dataset.demo){const b=DEMOS()[fr.dataset.demo];if(b)mountFrame(fr,genSite(demoSite(fr.dataset.demo)),false)}else{const h=THUMBS[fr.dataset.thumb];if(h)mountFrame(fr,h,false)}},i*70)};
  const rv=RM?[]:[...v.querySelectorAll('.lp-sec h2,.lp-sec .sub,.lp-card,.lp-why>div,.steps>.card,.plan,.demo,.lp-sec details,.cta')];
  rv.forEach((el,i)=>{el.classList.add('prv');el.style.setProperty('--d',((i%4)*90)+'ms')});
  if(!('IntersectionObserver' in window)){lazy.forEach(load);rv.forEach(el=>el.classList.add('in'));return}
  FXIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;FXIO.unobserve(el);if(el.dataset.demo||el.dataset.thumb)load(el);else el.classList.add('in')}),{rootMargin:'0px 0px -40px 0px',threshold:.08});
  lazy.concat(rv).forEach(el=>FXIO.observe(el));
}

  delete AP_PART[id];

}

  const j=await fnPost('ai-gateway',{action:'edit',website_id:id,instruction,history:history||[],choices:dnaChoices(w0.data.site_type)},{ms:110000});
  if(!(j&&j.ok))return j||{ok:false,error:'err'};
  const w=await sb.from('websites').select('config,name,site_type,status').eq('id',id).single();if(w.error)throw w.error;
  const s=specOf(w.data),brief={...j.brief};delete brief._data;
  brief.dna=j.redesign?newDNA(brief.type):(cleanDNA(brief.dna,brief.type)||s.brief.dna);
  const data=j.items?{items:j.items}:s.data;
  const vv=await sb.from('website_versions').select('version').eq('website_id',id).order('version',{ascending:false}).limit(1);
  const before=vv.data?.[0]?.version||0,html=genSite(data?{...brief,_data:data}:brief);
  if(!before)await saveHtml(id,w.data.config?.html||html,'before-edit',{brief:s.brief});
  await saveHtml(id,html,'edit: '+instruction.slice(0,150),{brief,...(onChat?{ai_chat:onChat(j.reply,before||1)}:{})});
  const pub=w.data.status==='published'?await autoPublish(id):null;
  return{ok:true,reply:j.reply,html,before:before||1,pub};
}

/* ----- chart helpers ----- */
function series(rows,n,val,key){key=key||'created_at';const out=Array(n).fill(0),t0=Date.now();
  rows.forEach(r=>{const i=n-1-Math.floor((t0-new Date(r[key]).getTime())/DAY);if(i>=0&&i<n)out[i]+=val?Number(val(r))||0:1});return out}
function lbls(n){return [...Array(n)].map((_,i)=>new Date(Date.now()-(n-1-i)*DAY).toLocaleDateString(L==='ar'?'ar':'en',{month:'short',day:'numeric'}))}
function area(vals,labels,h){h=h||200;
  const w=640,p=30,mx=Math.max(1,...vals),n=vals.length;
  const X=i=>p+(n===1?0:i*(w-2*p)/(n-1)),Y=v=>h-26-(v/mx)*(h-52);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${p}" x2="${w-p}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--bd)"/><text x="2" y="${Y(mx*f)+4}" font-size="10" fill="var(--tx2)">${Math.round(mx*f)}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xl=labels.map((l,i)=>i%step===0?`<text x="${X(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--tx2)">${l}</text>`:'').join('');
  const dots=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${n>31?2:4}" fill="#fff" stroke="var(--ac)" stroke-width="2"><title>${labels[i]}: ${vals[i]}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;direction:ltr"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2433ff" stop-opacity=".28"/><stop offset="1" stop-color="#2433ff" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${line}L${X(n-1).toFixed(1)} ${h-26}L${X(0).toFixed(1)} ${h-26}Z" fill="url(#ga)"/><path d="${line}" pathLength="1000" fill="none" stroke="var(--ac)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" class="draw"/>${dots}${xl}</svg>`;
}
function spark(v){const w=120,h=38,mx=Math.max(1,...v),n=v.length;const pts=v.map((x,i)=>[i*w/(n-1||1),h-3-(x/mx)*(h-8)]);const l=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${l}L${w} ${h}L0 ${h}Z" fill="var(--ac)" opacity=".1"/><path d="${l}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function donut(items,center,lab){const tot=items.reduce((a,x)=>a+x.v,0),C=2*Math.PI*52;let off=0;
  const arcs=tot?items.map(x=>{const len=x.v/tot*C;const el=`<circle r="52" cx="70" cy="70" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(x.l)}: ${x.v}</title></circle>`;off+=len;return el}).join(''):'';
  return `<div class="row2" style="gap:20px;flex-wrap:nowrap"><svg viewBox="0 0 140 140" width="150" height="150" style="flex:none"><circle r="52" cx="70" cy="70" fill="none" stroke="var(--bd)" stroke-width="18"/>${arcs}<text x="70" y="72" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${center}</text><text x="70" y="90" text-anchor="middle" font-size="11" fill="var(--tx2)">${esc(lab||'')}</text></svg>
  <div style="display:grid;gap:8px;font-size:14px">${items.map(x=>`<div><i class="dot" style="background:${x.c}"></i>${esc(x.l)} <b>${tot?Math.round(x.v/tot*100):0}%</b></div>`).join('')}</div></div>`}
const statCard=(i,lab,val,vals,pre)=>`<div class="card"><div class="statc"><div class="ico">${ic(i)}</div><div><b class="big">${pre||''}<span data-count="${Math.round(val)}">0</span></b><span style="color:var(--tx2);font-size:13px">${lab}</span></div></div>${spark(vals)}</div>`;
function chartBox(id,v,l,title,n){n=n||30;ST[id]={v,l};return `<div class="card"><div class="row2"><h3>${title}</h3><span class="sp"></span><div class="rg">${[7,30,90].map(x=>`<button class="${x===n?'on':''}" data-act="range" data-id="${id}" data-n="${x}">${t('r'+x)}</button>`).join('')}</div></div><br><div id="ch-${id}">${area(v.slice(-n),l.slice(-n))}</div></div>`}
const topList=(m,fmt)=>{fmt=fmt||(x=>esc(x));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=e[0]?e[0][1]:1;return e.length?e.map(([k,c])=>`<div class="bar"><span>${fmt(k)}</span><div><i style="width:${(c/mx*100).toFixed(0)}%"></i></div><b>${c}</b></div>`).join(''):`<div style="color:var(--tx2)">${t('nodata')}</div>`};
function analyticsBlock(E){
  const n=90,v=series(E,n),l=lbls(n),uq=new Set(E.map(e=>e.visitor)).size;
  const cnt=k=>{const m={};E.forEach(e=>{const x=e[k];if(x!=null&&x!=='')m[x]=(m[x]||0)+1});return m};
  const host=x=>{try{return new URL(x).hostname}catch(e){return x}};
  const ref={};E.forEach(e=>{const k=e.referrer?host(e.referrer):t('direct');ref[k]=(ref[k]||0)+1});
  const dcol={desktop:'#2433ff',mobile:'#00c2a8',tablet:'#f59e0b'},dev=cnt('device');
  return `<div class="stats"><div class="card stat"><b data-count="${E.length}">0</b><span>${t('visits')}</span></div><div class="card stat"><b data-count="${uq}">0</b><span>${t('uniq')}</span></div><div class="card stat"><b>${uq?(E.length/uq).toFixed(1):'0'}</b><span>${t('ppv')}</span></div></div>
  <div class="dgrid" style="margin-top:0"><div class="c8">${chartBox('vis',v,l,t('visits'),30)}</div><div class="c4 card"><h3>${t('devices')}</h3><br>${donut(Object.entries(dev).map(([k,x])=>({l:k,v:x,c:dcol[k]||'#9aa0c0'})),E.length,t('visits'))}</div>
  <div class="c4 card"><h3>${t('toppages')}</h3><br>${topList(cnt('path'))}</div><div class="c4 card"><h3>${t('referrers')}</h3><br>${topList(ref)}</div><div class="c4 card"><h3>${t('countries')}</h3><br>${topList(cnt('country'))}</div></div>`;
}

/* استدعاء دالة Edge بمهلة. لا يرمي أبداً: عند الفشل يرجع {ok:false,error:'timeout'|'network'|...} */
async function fx(name,body,ms){
  let tok;
  try{const {data:s}=await withTimeout(sb.auth.getSession(),8000,'session');tok=s.session&&s.session.access_token}catch(e){return{ok:false,error:'session_timeout'}}
  if(!tok)return{ok:false,error:'not_signed_in'};
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms||25000);
  try{
    const r=await fetch(SB_URL+'/functions/v1/'+name,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok,apikey:SB_KEY},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok&&!j.error)j.error='http_'+r.status;
    j._status=r.status;
    return j;
  }catch(e){return{ok:false,error:e&&e.name==='AbortError'?'timeout':'network'}}
  finally{clearTimeout(to)}
}
const fnPost=(name,body,opts)=>fx(name,body,opts&&opts.ms);
async function gw(body,opts){

}

async function createSite(brief,slug,files){
  files=files||{};brief.dna=newDNA(brief.type);
  const ins=await sb.from('websites').insert({owner_id:me.id,name:brief.name,site_type:brief.type,slug,config:{brief}}).select().single();if(ins.error)throw ins.error;
  const sid=ins.data.id;boOpen(t('bo_building'),t('bo_building_s'),[t('bo_p0'),t('bo_p1'),t('bo_p2'),t('bo_p3')]);boStage(0);
  try{const lf=files.logo||null,bl=files.banners||[];

        if(lf||bl.length){if(lf)brief.logo=await uploadAsset(sid,lf,400);brief.banners=[];for(const x of bl){const o={t:x.t,u:x.u};if(x._f)o.img=await uploadAsset(sid,x._f,1600);brief.banners.push(o)}if(brief.banners[0]&&brief.banners[0].t)brief.banner=brief.banners[0].t;
          const u2=await sb.from('websites').update({config:{brief}}).eq('id',sid);if(u2.error)throw u2.error}
        const imf=files.items||[];let gd=null;
        if(imf.some(Boolean)){const its=siteItems({type:brief.type,lang:brief.lang,items:brief.items}).items.map(x=>({...x}));for(let i=0;i<its.length;i++)if(imf[i])its[i].img=await uploadAsset(sid,imf[i],1000);gd={items:its}}
        await saveHtml(sid,genSite(gd?{...brief,_data:gd}:brief),'initial',{brief});let how='tpl',why='',det='';
        boStage(1);boSet(t('bo_building'),t('bo_wait'));
        const j=await aiDesign(sid,brief,gd);
        if(j.ok)how='ai';else{why=j.error||'';det=j.detail||''}
        boStage(3);
        const pub=await autoPublish(sid);
        const note=how==='ai'?'':t('bo_tpl_note')+(why&&why!=='service_not_configured'?' ('+errText(why)+(det?': '+String(det).slice(0,90):'')+')':'');
        if(pub.ok)boDone(t('bo_live'),(note?note+' · ':'')+pub.url,[`<a class="btn p lg" href="${esc(pub.url)}" target="_blank" rel="noopener">${t('openlive')}</a>`,`<button class="btn s lg" data-act="boview" data-id="${sid}">${t('bo_manage')}</button>`]);
        else if(pub.error==='contract_pending'){
          try{await sb.rpc('notify_site_needs_contract',{p_site:sid})}catch(e){}
          boDone(t('bo_ctr_t'),(how==='ai'?t('bo_ready_ai'):t('bo_ready_tpl'))+(note&&how!=='ai'?' ('+note+')':'')+' · '+t('bo_ctr_d'),[`<button class="btn s lg" data-act="boview" data-id="${sid}">${t('bo_manage')}</button>`]);
        }
        else boDone(t('bo_ready'),(how==='ai'?t('bo_ready_ai'):t('bo_ready_tpl'))+(note&&how!=='ai'?' ('+note+')':'')+' · '+t('pubfail')+': '+errText(pub.error),[`<button class="btn p lg" data-act="bopublish" data-id="${sid}">${t('send')}</button>`,`<button class="btn s lg" data-act="boview" data-id="${sid}">${t('preview')}</button>`]);
      }catch(x){boClose();throw x}
  return sid;
}

function wireSignPad(cv){
  const ctx=cv.getContext('2d');ctx.lineWidth=2.4;ctx.lineCap='round';ctx.strokeStyle='#111';
  let drawing=false,lx=0,ly=0;
  const pos=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);return [x,y]};
  cv.onpointerdown=e=>{drawing=true;cv._inked=(cv._inked||0);[lx,ly]=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();cv._inked+=Math.hypot(x-lx,y-ly);[lx,ly]=[x,y]};
  cv.onpointerup=()=>drawing=false;cv.onpointerleave=()=>drawing=false;
}

      if(!(j&&j.ok)){box.insertAdjacentHTML('beforeend',apMsg({role:'err',content:errText(j&&j.error||'err')+(j&&j.detail?' ('+String(j.detail).slice(0,140)+')':'')}));box.scrollTop=box.scrollHeight;f.elements.m.value=m;btn.disabled=false;return}
      box.insertAdjacentHTML('beforeend',apMsg({role:'assistant',content:j.content,type:j.type,plan:j.plan,files:j.files},-1,j.type==='plan'));box.scrollTop=box.scrollHeight;btn.disabled=false;
      if(j.type==='plan'){const bb=box.querySelector('[data-act="apbuild"]');if(bb){bb.dataset.i='-1';bb._m={type:'plan',plan:j.plan}}}
      if(j.type==='edit'){btn.disabled=true;await apRunBuild(id,{type:'edit',files:j.files},m);btn.disabled=false}
      return}
    if(k==='items'){
      const rows=[...f.querySelectorAll('.irow')].map(r=>{const g=q=>r.querySelector('[data-k="'+q+'"]').value.trim(),o={n:g('n'),c:g('c'),p:g('p'),d:g('d')},im=g('img');if(im)o.img=im;return o}).filter(x=>x.n);
      const logo=$('#logoUrl').value,cur=(d.cur||'').trim();
      if(rows.length>60)throw new Error(t('err'));
      const w=await sb.from('websites').select('config').eq('id',f.dataset.id).single();const cur_html=(w.data&&w.data.config&&w.data.config.html)||'';
      if(!readSD(cur_html))throw new Error(t('err'));
      const banners=readBn(f).map(({_f,...x})=>x).filter(x=>x.t||x.img);
      const osd=readSD(cur_html),nd={items:rows};if(osd&&osd.layout)nd.layout=osd.layout;if(logo)nd.logo=logo;if(cur)nd.cur=cur;if(banners.length)nd.banners=banners;
      const cfg0=(w.data&&w.data.config)||{},nb={...(cfg0.brief||{}),logo,cur,banners};
      /* pages made from our template are re-generated so the logo and banners appear in the hero too; AI pages keep their design */
      const base=/name="ibtikar-tpl"/.test(cur_html)?genSite({...nb,_data:nd}):cur_html;
      await saveHtml(f.dataset.id,writeSD(base,nd),'items');
      {const w2=await sb.from('websites').select('config').eq('id',f.dataset.id).single(),c2=(w2.data&&w2.data.config)||{};await sb.from('websites').update({config:{...c2,brief:nb}}).eq('id',f.dataset.id)}
      if(f.dataset.pub==='1'){toast(t('publishing'));const r=await autoPublish(f.dataset.id);if(!r.ok)throw new Error(t('pubfail')+': '+errText(r.error));toast(t('it_saved_pub'))}else toast(t('saved'));
      render({keep:true});return}
    if(k==='connect'){if(d.kind==='cloudflare'&&!d.curl&&!/^[0-9a-f]{32}$/i.test(String(d.account_id||'').trim()))throw new Error(errText('account_id_required'));toast(t('c_working'));const cr=$('#cres');if(cr)cr.hidden=true;
      const j=await fx('ai-gateway',d.curl?{action:'connect',curl:d.curl}:{action:'connect',kind:d.kind,key:d.key,endpoint:d.endpoint||undefined,name:d.name||undefined,account_id:d.kind==='cloudflare'?String(d.account_id||'').trim():undefined},90000);
      if(!j.ok){if(cr){cr.hidden=false;cr.innerHTML=`<div class="card" style="border-color:var(--er)"><b style="color:var(--er)">${esc(errText(j.error||'err'))}${j.hint?' — '+esc(errText(j.hint)):''}</b>${j.provider?`<div style="font-size:13px;margin-top:6px">${esc(j.provider)}${j.status?' · HTTP '+esc(j.status):''}</div>`:''}${j.detail?`<pre dir="ltr" style="white-space:pre-wrap;font-size:12px;margin-top:8px;color:var(--tx2)">${esc(String(j.detail).slice(0,300))}</pre>`:''}</div>`}
        throw new Error(errText(j.error||'err'))}
      await audit('provider.connect','ai_providers',{kind:d.kind||'curl'});
      toast((j.switched?t('c_switched')+' ('+(j.provider&&j.provider.name||'')+') · ':'')+(j.tested&&j.tested.ok?t('c_ok'):t('c_warn')+(j.tested&&j.tested.error?': '+String(j.tested.error).slice(0,80):'')),!(j.tested&&j.tested.ok));render({keep:true});return}
    if(k==='aicfg'){let bj;try{bj=JSON.parse(d.bounds);if(!['simple','medium','advanced','major'].every(x=>Array.isArray(bj[x])&&bj[x].length===2&&bj[x][0]>=0&&bj[x][1]>=bj[x][0]))throw 0}catch(e){throw new Error(t('err'))}
      for(const [key,value] of [['ai.free_budget_usd',String(Math.max(0,+d.free||0))],['ai.quote_bounds',JSON.stringify(bj)],['ai.cost_markup',String(Math.max(1,+d.markup||4))]]){const r=await sb.from('platform_settings').upsert({key,value,updated_by:me.id});if(r.error)throw r.error}
      await audit('settings.ai','platform_settings',{});toast(t('saved'));render({keep:true});return}
    if(k==='airules'){for(const [key,value] of [['ai.master_rules_core',String(d.core||'').trim()],['ai.master_rules',String(d.full||'').trim()]]){const r=await sb.from('platform_settings').upsert({key,value,updated_by:me.id});if(r.error)throw r.error}await audit('settings.ai_rules','platform_settings',{});toast(t('saved'));render({keep:true});return}
    if(k==='profile'){const r=await sb.from('profiles').update({full_name:d.name}).eq('id',me.id);if(r.error)throw r.error;await loadMe();toast(t('saved'));render({keep:true});return}
    if(k==='password'){const r=await sb.auth.updateUser({password:d.pass});if(r.error)throw r.error;toast(t('saved'));f.reset()}
    if(k==='server'){const r=await sb.from('servers').insert({name:d.name,region:d.region||null});if(r.error)throw r.error;await audit('server.add','servers',{name:d.name});toast(t('saved'));render({keep:true});return}
    if(k==='aiedit'){btn.textContent=t('building');const cur=$('#code').value;const j=await gw({action:'chat',website_id:f.dataset.id,messages:[{role:'system',content:'You edit a single self-contained HTML page. Return only the complete updated HTML document, nothing else.'},{role:'user',content:'Current page:\n'+cur+'\n\nRequested change: '+d.prompt}]});const h=cleanHtml(j.text);$('#code').value=h;$('#pv').srcdoc=h;toast(t('previewReady'));btn.textContent=t('applyc');btn.disabled=false;return}
    if(k==='rename'){const r=await sb.from('websites').update({name:d.name}).eq('id',f.dataset.id);if(r.error)throw r.error;toast(t('saved'));render({keep:true});return}
    if(k==='domain'){const r=await sb.from('domains').insert({website_id:f.dataset.id,hostname:d.host.trim().toLowerCase()});if(r.error)throw r.error;toast(t('saved'));render({keep:true});return}
    if(k==='build'){
      btn.textContent=t('building');
      const j=await gw({action:'chat',website_id:f.dataset.id,usage_type:'general',messages:[{role:'system',content:'You generate one complete, responsive, self-contained HTML page (inline CSS, no external scripts, no remote images). Reply with only the HTML document.'},{role:'user',content:d.prompt}]});
      await saveHtml(f.dataset.id,cleanHtml(j.text),d.prompt);
      toast(t('saved'));render({keep:true});return;
    }
  }catch(x){fail(x);if(btn.dataset.l)btn.textContent=btn.dataset.l}
  btn.disabled=false;
});

function wzCompile(f){f.querySelector('textarea[name="items"]').value=[...f.querySelectorAll('#wzitems .wzrow')].map(r=>['n','p','d'].map(k=>r.querySelector('[data-wi="'+k+'"]').value.trim().replace(/[|\n]/g,' ')).join('|')).filter(l=>l.split('|')[0]).join('\n')}
document.addEventListener('input',e=>{const wi=e.target.closest('[data-wi]');if(wi){wzCompile(wi.closest('form'));return}
  if(e.target.id==='wzcolor'){const r=$('#wzcustom');r.value=e.target.value;r.checked=true}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('form[data-form="wizard"]')&&e.target.tagName!=='TEXTAREA'){e.preventDefault();const f=e.target.closest('form'),n=+f.dataset.step;if(n<WZ_N&&wzValid(f,n))wzShow(f,n+1)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-ns]');if(!el)return;const v=nsLoad();if(!v.draft)return;const k=el.dataset.ns;
  if(k==='slug')v.draft.slug=el.value.toLowerCase();else if(k==='phone'){v.draft.brief.phone=el.value.trim()}else v.draft.brief[k]=el.value;nsSave(v)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.matches&&el.matches('select[data-ns]')){const v=nsLoad();if(v.draft){v.draft.brief[el.dataset.ns]=el.value;nsSave(v)}return}
  if(el.id==='nsLogo'){const fl=el.files&&el.files[0];NS_LOGO=fl&&/^image\//.test(fl.type)?fl:null;const n=$('#nsattn');if(n)n.textContent=NS_LOGO?'📎 '+NS_LOGO.name:''}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.target.tagName!=='TEXTAREA')return;const f=e.target.closest('form[data-form="nsmsg"]');if(!f)return;e.preventDefault();if(e.target.value.trim())f.requestSubmit()});
let slT;document.addEventListener('input',e=>{
  if(e.target.id!=='sl')return;const i=e.target,v=i.value.toLowerCase().replace(/[^a-z0-9-]/g,'');if(v!==i.value)i.value=v;
  const st=$('#slst'),pv=$('#slp');if(pv)pv.textContent=v||'royal';clearTimeout(slT);
  st.dataset.ok='';if(v.length<3){st.textContent=t('sub_hint');st.style.color='var(--tx2)';return}
  slT=setTimeout(async()=>{const r=await sb.rpc('slug_available',{p_slug:v});if(i.value!==v)return;const ok=r.data===true;st.dataset.ok=ok?'1':'0';st.textContent=ok?'✓ '+t('sub_ok'):'✗ '+t('sub_taken');st.style.color=ok?'var(--ok)':'var(--er)'},350)});
let sT;document.addEventListener('input',e=>{
  if(e.target.id!=='gs')return;clearTimeout(sT);
  const q=e.target.value.trim().replace(/[%_,()]/g,''),box=$('#sres');
  if(q.length<2){box.hidden=true;return}
  sT=setTimeout(async()=>{const like='%'+q+'%',rs=[];
    const [w,tk,u]=await Promise.all([sb.from('websites').select('id,name').ilike('name',like).limit(5),sb.from('support_tickets').select('id,subject').ilike('subject',like).limit(5),isAdm()?sb.from('profiles').select('id,full_name').ilike('full_name',like).limit(5):Promise.resolve({data:[]})]);
    (w.data||[]).forEach(x=>rs.push([x.name,'#/app/site/'+x.id,t('mysites')]));
    (tk.data||[]).forEach(x=>rs.push([x.subject,(isAdm()?'#/admin/tickets/':'#/app/support/')+x.id,t('support')]));
    (u.data||[]).forEach(x=>rs.push([x.full_name,'#/admin/users',t('users')]));
    box.hidden=false;box.innerHTML=rs.length?rs.map(([n,h,k])=>`<a href="${h}">${esc(n)}<small>${k}</small></a>`).join(''):`<div style="padding:12px;color:var(--tx2)">${t('nodata')}</div>`;
  },250)});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){const b=$('#sres');if(b)b.hidden=true}});
if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
(async()=>{
  const hosted=await resolveHosted();if(hosted){await showSite(hosted);return}
  if(PATH_SLUG){await showSite(PATH_SLUG,true);return}
  await loadMe();
  /* مهم: callback غير async ولا يستدعي Supabase مباشرةً. supabase-js يمسك قفل المصادقة أثناء إطلاق الأحداث
     (SIGNED_IN عند الرجوع للتطبيق، TOKEN_REFRESHED عند التجديد)، وأي await لدالة Supabase هنا = deadlock
     تتجمد به كل الطلبات حتى إعادة التحميل. لذلك نؤجّل العمل خارج الـcallback. */
  sb.auth.onAuthStateChange((ev,sess)=>{
    const uid=sess&&sess.user&&sess.user.id||null;
    if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>{location.hash='#/reset'},0);return}
    if(ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION')return;
    if(ev==='SIGNED_IN'&&uid&&me&&uid===me.id)return;        // رجوع للتبويب بنفس المستخدم: لا حاجة لإعادة التحميل
    setTimeout(()=>{loadMe().then(()=>{chrome();if(ev==='SIGNED_OUT')render()})},0);
  });
  banner().catch(()=>{});
  render();
})();
</script>
