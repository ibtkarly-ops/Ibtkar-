<style>

:root{--bg:#fff;--bg2:#F7F8FA;--tx:#171717;--tx2:#6b7280;--bd:#EAECEF;--ac:#2433ff;--ac2:#00c2a8;--ok:#16a34a;--wa:#f59e0b;--er:#dc2626;--g:linear-gradient(115deg,#2433ff 0%,#5b4bff 48%,#00c2a8 100%);--sh:0 1px 2px rgba(23,23,23,.04),0 14px 34px -18px rgba(23,23,23,.22)}
*{box-sizing:border-box;margin:0}

.wrap{max-width:1180px;margin:auto;padding:0 22px}

input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}

@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:44px}.dash{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;position:static}.side a{white-space:nowrap}nav .links{display:none}.bento .card,.bento .card:nth-child(n){grid-column:span 6}.steps{grid-template-columns:1fr}.edit{grid-template-columns:1fr}}

async function banner(){
  const now=new Date().toISOString();
  const {data}=await sb.from('banners').select('*').eq('placement','announcement').eq('active',true).order('sort').limit(5);
  const b=(data||[]).find(x=>(!x.starts_at||x.starts_at<=now)&&(!x.ends_at||x.ends_at>=now));
  const el=$('#bar');
  if(!b){el.hidden=true;return}
  el.hidden=false;el.innerHTML=b.link?`<a href="${esc(b.link)}" data-bid="${b.id}">${esc(L==='ar'?b.title_ar:b.title_en)||''}</a>`:esc(L==='ar'?b.title_ar:b.title_en);
  if(b.bg&&/^#[0-9a-f]{3,8}$/i.test(b.bg))el.style.background=b.bg;
  sb.from('banners').update({views:b.views+1}).eq('id',b.id).then(()=>{});
}

/* ----- build / publish overlay ----- */
function boOpen(title,sub,stages){let el=$('#bo');if(!el){el=document.createElement('div');el.id='bo';document.body.append(el)}
  el.className='bo';el.innerHTML=`<div class="bo-c" role="dialog" aria-live="polite"><div class="orb"><i></i><i></i><i></i></div><h2>${esc(title)}</h2><p>${esc(sub||'')}</p>${stages&&stages.length?`<ul class="bo-s">${stages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="row2 bo-a" style="justify-content:center"></div></div>`}
function boStage(i){document.querySelectorAll('#bo .bo-s li').forEach((li,j)=>{li.className=j<i?'done':j===i?'now':''})}
function boSet(title,sub){const el=$('#bo');if(!el)return;el.querySelector('h2').textContent=title;el.querySelector('p').textContent=sub||''}
function boDone(title,sub,btns,err){const el=$('#bo');if(!el)return;el.className='bo '+(err?'err':'ok');boSet(title,sub);document.querySelectorAll('#bo .bo-s li').forEach(li=>li.className=err?li.className:'done');el.querySelector('.bo-a').innerHTML=btns.join('');
  if(!err&&!matchMedia('(prefers-reduced-motion:reduce)').matches){for(let i=0;i<46;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=['#2433ff','#00c2a8','#f59e0b','#5b4bff','#16a34a'][i%5];c.style.animationDelay=Math.random()*.6+'s';el.append(c);setTimeout(()=>c.remove(),3200)}}}
function boClose(){const el=$('#bo');if(el)el.remove()}

  boOpen(t('mr_applying'),t('mr_applying_s'),[]);

      boDone(t('mr_done'),t('mr_done_s')+' · '+t('pubok'),[`<a class="btn p lg" href="${esc(pj.url)}" target="_blank" rel="noopener">${t('openlive')}</a>`,`<button class="btn s lg" data-act="boview" data-id="${sid}">${t('bo_manage')}</button>`]);return

}
/* ----- chart helpers ----- */
function series(rows,n,val,key){key=key||'created_at';const out=Array(n).fill(0),t0=Date.now();
  rows.forEach(r=>{const i=n-1-Math.floor((t0-new Date(r[key]).getTime())/DAY);if(i>=0&&i<n)out[i]+=val?Number(val(r))||0:1});return out}
function lbls(n){return [...Array(n)].map((_,i)=>new Date(Date.now()-(n-1-i)*DAY).toLocaleDateString(L==='ar'?'ar':'en',{month:'short',day:'numeric'}))}
function area(vals,labels,h){h=h||200;
  const w=640,p=30,mx=Math.max(1,...vals),n=vals.length;
  const X=i=>p+(n===1?0:i*(w-2*p)/(n-1)),Y=v=>h-26-(v/mx)*(h-52);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${p}" x2="${w-p}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--bd)"/><text x="2" y="${Y(mx*f)+4}" font-size="10" fill="var(--tx2)">${Math.round(mx*f)}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xl=labels.map((l,i)=>i%step===0?`<text x="${X(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--tx2)">${l}</text>`:'').join('');
  const dots=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${n>31?2:4}" fill="#fff" stroke="var(--ac)" stroke-width="2"><title>${labels[i]}: ${vals[i]}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;direction:ltr"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2433ff" stop-opacity=".28"/><stop offset="1" stop-color="#2433ff" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${line}L${X(n-1).toFixed(1)} ${h-26}L${X(0).toFixed(1)} ${h-26}Z" fill="url(#ga)"/><path d="${line}" pathLength="1000" fill="none" stroke="var(--ac)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" class="draw"/>${dots}${xl}</svg>`;
}
function spark(v){const w=120,h=38,mx=Math.max(1,...v),n=v.length;const pts=v.map((x,i)=>[i*w/(n-1||1),h-3-(x/mx)*(h-8)]);const l=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${l}L${w} ${h}L0 ${h}Z" fill="var(--ac)" opacity=".1"/><path d="${l}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function donut(items,center,lab){const tot=items.reduce((a,x)=>a+x.v,0),C=2*Math.PI*52;let off=0;
  const arcs=tot?items.map(x=>{const len=x.v/tot*C;const el=`<circle r="52" cx="70" cy="70" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(x.l)}: ${x.v}</title></circle>`;off+=len;return el}).join(''):'';
  return `<div class="row2" style="gap:20px;flex-wrap:nowrap"><svg viewBox="0 0 140 140" width="150" height="150" style="flex:none"><circle r="52" cx="70" cy="70" fill="none" stroke="var(--bd)" stroke-width="18"/>${arcs}<text x="70" y="72" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${center}</text><text x="70" y="90" text-anchor="middle" font-size="11" fill="var(--tx2)">${esc(lab||'')}</text></svg>
  <div style="display:grid;gap:8px;font-size:14px">${items.map(x=>`<div><i class="dot" style="background:${x.c}"></i>${esc(x.l)} <b>${tot?Math.round(x.v/tot*100):0}%</b></div>`).join('')}</div></div>`}
const statCard=(i,lab,val,vals,pre)=>`<div class="card"><div class="statc"><div class="ico">${ic(i)}</div><div><b class="big">${pre||''}<span data-count="${Math.round(val)}">0</span></b><span style="color:var(--tx2);font-size:13px">${lab}</span></div></div>${spark(vals)}</div>`;
function chartBox(id,v,l,title,n){n=n||30;ST[id]={v,l};return `<div class="card"><div class="row2"><h3>${title}</h3><span class="sp"></span><div class="rg">${[7,30,90].map(x=>`<button class="${x===n?'on':''}" data-act="range" data-id="${id}" data-n="${x}">${t('r'+x)}</button>`).join('')}</div></div><br><div id="ch-${id}">${area(v.slice(-n),l.slice(-n))}</div></div>`}
const topList=(m,fmt)=>{fmt=fmt||(x=>esc(x));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=e[0]?e[0][1]:1;return e.length?e.map(([k,c])=>`<div class="bar"><span>${fmt(k)}</span><div><i style="width:${(c/mx*100).toFixed(0)}%"></i></div><b>${c}</b></div>`).join(''):`<div style="color:var(--tx2)">${t('nodata')}</div>`};
function analyticsBlock(E){
  const n=90,v=series(E,n),l=lbls(n),uq=new Set(E.map(e=>e.visitor)).size;
  const cnt=k=>{const m={};E.forEach(e=>{const x=e[k];if(x!=null&&x!=='')m[x]=(m[x]||0)+1});return m};
  const host=x=>{try{return new URL(x).hostname}catch(e){return x}};
  const ref={};E.forEach(e=>{const k=e.referrer?host(e.referrer):t('direct');ref[k]=(ref[k]||0)+1});
  const dcol={desktop:'#2433ff',mobile:'#00c2a8',tablet:'#f59e0b'},dev=cnt('device');
  return `<div class="stats"><div class="card stat"><b data-count="${E.length}">0</b><span>${t('visits')}</span></div><div class="card stat"><b data-count="${uq}">0</b><span>${t('uniq')}</span></div><div class="card stat"><b>${uq?(E.length/uq).toFixed(1):'0'}</b><span>${t('ppv')}</span></div></div>
  <div class="dgrid" style="margin-top:0"><div class="c8">${chartBox('vis',v,l,t('visits'),30)}</div><div class="c4 card"><h3>${t('devices')}</h3><br>${donut(Object.entries(dev).map(([k,x])=>({l:k,v:x,c:dcol[k]||'#9aa0c0'})),E.length,t('visits'))}</div>
  <div class="c4 card"><h3>${t('toppages')}</h3><br>${topList(cnt('path'))}</div><div class="c4 card"><h3>${t('referrers')}</h3><br>${topList(ref)}</div><div class="c4 card"><h3>${t('countries')}</h3><br>${topList(cnt('country'))}</div></div>`;
}

const since=n=>new Date(Date.now()-n*DAY).toISOString();
const STC={draft:'#9aa0c0',building:'#f59e0b',published:'#00c2a8',stopped:'#dc2626'};

async function saveHtml(id,html,note){
  const w=await sb.from('websites').select('config').eq('id',id).single();
  const up=await sb.from('websites').update({config:{...(w.data?.config||{}),html},updated_at:new Date().toISOString()}).eq('id',id);if(up.error)throw up.error;
  const vv=await sb.from('website_versions').select('version').eq('website_id',id).order('version',{ascending:false}).limit(1);
  const ins=await sb.from('website_versions').insert({website_id:id,version:(vv.data?.[0]?.version||0)+1,snapshot:{html},note:(note||'').slice(0,200),created_by:me.id});if(ins.error)throw ins.error;
}
async function gw(body){
  const {data:s}=await sb.auth.getSession();
  const r=await fetch(SB_URL+'/functions/v1/ai-gateway',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.session.access_token,apikey:SB_KEY},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error==='service_not_configured'?t('nosvc'):j.error==='quota_exceeded'?t('quota'):(j.error||t('err')));
  return j;
}
async function fnPost(name,body){
  const {data:s}=await sb.auth.getSession();

  return r.json().catch(()=>({}));
}

function wireSignPad(cv){
  const ctx=cv.getContext('2d');ctx.lineWidth=2.4;ctx.lineCap='round';ctx.strokeStyle='#111';
  let drawing=false,lx=0,ly=0;
  const pos=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);return [x,y]};
  cv.onpointerdown=e=>{drawing=true;[lx,ly]=pos(e)};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y]};
  cv.onpointerup=()=>drawing=false;cv.onpointerleave=()=>drawing=false;
}

    if(k==='provider'){const r=await sb.from('ai_providers').insert({name:d.name,kind:d.kind,endpoint:d.endpoint||null,priority:+d.priority||100});if(r.error)throw r.error;await audit('provider.add','ai_providers',{name:d.name});toast(t('saved'));render({keep:true});return}
    if(k==='ticket'){const r=await sb.from('support_tickets').insert({user_id:me.id,subject:d.subject}).select().single();if(r.error)throw r.error;const m=await sb.from('ticket_messages').insert({ticket_id:r.data.id,author_id:me.id,body:d.body});if(m.error)throw m.error;location.hash='#/app/support/'+r.data.id;return}
    if(k==='reply'){const r=await sb.from('ticket_messages').insert({ticket_id:f.dataset.id,author_id:me.id,body:d.body});if(r.error)throw r.error;toast(t('sent'));render({keep:true});return}

      toast(t('mr_analyzing'));const j=await fnPost('ai-gateway',{action:'quote',request_id:r.data.id});
      if(j&&j.error&&j.error!=='service_not_configured')throw new Error(t(j.error));toast(j&&j.ok?t('mr_priced'):t('mr_wait'));render({keep:true});return}

    if(k==='contract'){
      const file=d.file;
      if(!(file instanceof File)||!file.size)throw new Error(t('err'));
      if(file.size>8*1024*1024)throw new Error(t('err'));
      const mime=file.type;
      if(!['application/pdf','image/jpeg','image/png','image/webp'].includes(mime))throw new Error(t('err'));
      const ins=await sb.from('contracts').insert({customer_id:d.customer,title:d.title||null,created_by:me.id}).select().single();
      if(ins.error)throw ins.error;
      const ext=mime==='application/pdf'?'pdf':mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';
      const path=`original/${ins.data.id}.${ext}`;
      const up=await sb.storage.from('contracts').upload(path,file,{contentType:mime,upsert:false});
      if(up.error)throw up.error;

      await audit('contract.create','contracts',{id:ins.data.id});toast(t('saved'));render({keep:true});return;
    }
    if(k==='csign'){

        }catch(pe){

        }

    if(k==='preset'){const P={openai:['OpenAI','gpt-6-luna'],gemini:['Gemini','gemini-flash-latest'],anthropic:['Claude','claude-sonnet-5-5'],deepseek:['DeepSeek','deepseek-chat']}[d.kind];if(!P)throw new Error(t('err'));
      let {data:pv}=await sb.from('ai_providers').select('id').eq('name',P[0]).maybeSingle();
      if(!pv){const r=await sb.from('ai_providers').insert({name:P[0],kind:d.kind,priority:100}).select().single();if(r.error)throw r.error;pv=r.data}
      const mm=await sb.from('ai_models').select('id').eq('provider_id',pv.id).eq('model_id',P[1]).maybeSingle();
      const cost={cost_in_per_1m:+d.cin||0,cost_out_per_1m:+d.cout||0};
      if(!mm.data){const r=await sb.from('ai_models').insert({provider_id:pv.id,model_id:P[1],usage_type:'general',...cost});if(r.error)throw r.error}else{await sb.from('ai_models').update(cost).eq('id',mm.data.id)}
      const kr=await sb.rpc('admin_set_provider_key',{p_provider:pv.id,p_key:d.key});if(kr.error)throw kr.error;
      const en=await sb.from('ai_providers').update({enabled:true}).eq('id',pv.id);if(en.error)throw en.error;
      const j=await fnPost('ai-gateway',{action:'test',provider_id:pv.id});if(!j.ok)throw new Error(t('err')+': '+(j.error||''));
      await audit('provider.preset','ai_providers',{name:P[0]});toast(t('preset_ok'));render({keep:true});return}
    if(k==='aicfg'){let bj;try{bj=JSON.parse(d.bounds);if(!['simple','medium','advanced','major'].every(x=>Array.isArray(bj[x])&&bj[x].length===2&&bj[x][0]>=0&&bj[x][1]>=bj[x][0]))throw 0}catch(e){throw new Error(t('err'))}
      for(const [key,value] of [['ai.free_budget_usd',String(Math.max(0,+d.free||0))],['ai.quote_bounds',JSON.stringify(bj)],['ai.cost_markup',String(Math.max(1,+d.markup||4))]]){const r=await sb.from('platform_settings').upsert({key,value,updated_by:me.id});if(r.error)throw r.error}
      await audit('settings.ai','platform_settings',{});toast(t('saved'));render({keep:true});return}
